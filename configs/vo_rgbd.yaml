dataset:
  root: data/raw/tum/rgbd_dataset_freiburg1_xyz

# TUM Freiburg1 的 RGB 相机参数；深度原始值除以 5000 转成米。
camera:
  fx: 525.0
  fy: 525.0
  cx: 319.5
  cy: 239.5
  width: 640
  height: 480
  distortion: [0, 0, 0, 0, 0]
  depth_scale: 5000.0

orb:
  nfeatures: 2000

matching:
  ratio: 0.75

vo:
  min_depth: 0.3
  max_depth: 5.0
  min_correspondences: 20
  min_inliers: 15
  min_inlier_ratio: 0.35
  reprojection_px: 3.0